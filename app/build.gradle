plugins { id "com.android.application" }
android {
  namespace "jp.hasami.geolog"
  compileSdk 36
  defaultConfig {
    applicationId "jp.hasami.geolog"
    minSdk 30          // Rakuten Hand 5G は Android 11
    targetSdk 36
    versionCode 16
    versionName "0.10.0"
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  // 町字のデータ（rgeo_all.bin）は圧縮せずに入れて、そのままメモリに割り当てて読む
  androidResources { noCompress += "bin" }
}
